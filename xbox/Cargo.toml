[package]
name = "blink-xbox"
version = "0.1.0"
edition = "2021"
description = "Drives the blink x86-64 Linux emulator (C) from Rust, for running Linux programs inside the Xbox UWP app"
license = "ISC"

[lib]
name = "blink_xbox"
path = "src/lib.rs"

[[bin]]
name = "blink"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[profile.release]
debug = 1

# The POSIX host layer blink's C needs on Windows/UWP (src/win)
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
]
