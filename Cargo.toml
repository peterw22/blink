[package]
name = "blink-xbox"
version = "0.1.0"
edition = "2021"
description = "Drives the blink x86-64 Linux emulator (C) from Rust, for running Linux programs inside the Xbox UWP app"
license = "ISC"

[lib]
name = "blink_xbox"
path = "src/lib.rs"

[[bin]]
name = "blink"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[profile.release]
debug = 1
